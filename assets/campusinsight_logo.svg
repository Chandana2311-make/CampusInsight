<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ICON BADGE GROUP (Center: x=60, y=60, radius=48) -->
  <g transform="translate(10, 10)" filter="url(#softShadow)">
    <!-- Shield / Circular Base Background with subtle border -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- 1. OPEN BOOK (Learning) at the base -->
    <!-- Left page -->
    <path d="M 22 72 C 32 68, 44 68, 50 72 L 50 56 C 44 52, 32 52, 22 56 Z" fill="url(#navyGrad)" opacity="0.9"/>
    <!-- Right page -->
    <path d="M 78 72 C 68 68, 56 68, 50 72 L 50 56 C 56 52, 68 52, 78 56 Z" fill="url(#tealGrad)" opacity="0.9"/>
    <!-- Center spine bookmark -->
    <path d="M 50 72 L 50 79 L 52 77 L 54 79 L 54 72 Z" fill="#0D9488"/>

    <!-- 2. ANALYTICS BARS (Academic Growth) rising above the book -->
    <!-- Bar 1 -->
    <rect x="33" y="44" width="6" height="14" rx="2" fill="#3B82F6" opacity="0.85"/>
    <!-- Bar 2 -->
    <rect x="42" y="38" width="6" height="20" rx="2" fill="#2563EB"/>
    <!-- Bar 3 -->
    <rect x="51" y="32" width="6" height="26" rx="2" fill="#0D9488"/>
    <!-- Bar 4 -->
    <rect x="60" y="26" width="6" height="32" rx="2" fill="#14B8A6"/>

    <!-- 3. UPWARD ANALYTICS ARROW (Continuous Improvement) -->
    <path d="M 31 52 Q 46 38, 67 22" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polygon points="65,18 73,20 69,27" fill="#F59E0B"/>

    <!-- 4. GRADUATION CAP (Education) crowning the icon -->
    <!-- Skull cap under cap -->
    <path d="M 40 22 C 40 26, 60 26, 60 22 Z" fill="#1E3A8A"/>
    <!-- Mortarboard diamond top -->
    <polygon points="50,11 72,19 50,27 28,19" fill="url(#navyGrad)"/>
    <!-- Mortarboard rim highlight -->
    <polygon points="50,11 72,19 50,21 28,19" fill="#3B82F6" opacity="0.4"/>
    <!-- Cap Button & Tassel -->
    <circle cx="50" cy="19" r="1.8" fill="#F59E0B"/>
    <path d="M 50 19 Q 62 21, 65 29" stroke="#F59E0B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="65" cy="30" r="1.5" fill="#F59E0B"/>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (x=125, y=58) -->
  <g transform="translate(125, 0)">
    <!-- Brand Name -->
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
      <tspan fill="#1E3A8A">Campus</tspan>
      <tspan fill="#0D9488">Insight</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="82" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="1.2">
      STUDENT RESULT ANALYSIS &amp; IMPROVEMENT SYSTEM
    </text>

    <!-- Visual accent bar under tagline -->
    <rect x="2" y="92" width="72" height="3" rx="1.5" fill="url(#tealGrad)"/>
    <rect x="78" y="92" width="18" height="3" rx="1.5" fill="#F59E0B"/>
  </g>
</svg>
