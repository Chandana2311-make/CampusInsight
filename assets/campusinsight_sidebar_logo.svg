<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="navyGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="tealGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ICON BADGE GROUP -->
  <g transform="translate(10, 10)" filter="url(#glowDark)">
    <!-- Base Background -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    
    <!-- 1. OPEN BOOK (Learning) at the base -->
    <path d="M 22 72 C 32 68, 44 68, 50 72 L 50 56 C 44 52, 32 52, 22 56 Z" fill="url(#navyGradDark)" opacity="0.95"/>
    <path d="M 78 72 C 68 68, 56 68, 50 72 L 50 56 C 56 52, 68 52, 78 56 Z" fill="url(#tealGradDark)" opacity="0.95"/>
    <path d="M 50 72 L 50 79 L 52 77 L 54 79 L 54 72 Z" fill="#2DD4BF"/>

    <!-- 2. ANALYTICS BARS -->
    <rect x="33" y="44" width="6" height="14" rx="2" fill="#3B82F6"/>
    <rect x="42" y="38" width="6" height="20" rx="2" fill="#60A5FA"/>
    <rect x="51" y="32" width="6" height="26" rx="2" fill="#14B8A6"/>
    <rect x="60" y="26" width="6" height="32" rx="2" fill="#2DD4BF"/>

    <!-- 3. UPWARD ANALYTICS ARROW -->
    <path d="M 31 52 Q 46 38, 67 22" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
    <polygon points="65,18 73,20 69,27" fill="#FBBF24"/>

    <!-- 4. GRADUATION CAP -->
    <path d="M 40 22 C 40 26, 60 26, 60 22 Z" fill="#3B82F6"/>
    <polygon points="50,11 72,19 50,27 28,19" fill="#1E40AF"/>
    <polygon points="50,11 72,19 50,21 28,19" fill="#60A5FA" opacity="0.5"/>
    <circle cx="50" cy="19" r="1.8" fill="#FBBF24"/>
    <path d="M 50 19 Q 62 21, 65 29" stroke="#FBBF24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="65" cy="30" r="1.5" fill="#FBBF24"/>
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Optimized for dark background) -->
  <g transform="translate(125, 0)">
    <text x="0" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Campus</tspan>
      <tspan fill="#2DD4BF">Insight</tspan>
    </text>

    <text x="2" y="82" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="1.2">
      ACADEMIC INTELLIGENCE SYSTEM
    </text>

    <rect x="2" y="92" width="72" height="3" rx="1.5" fill="url(#tealGradDark)"/>
    <rect x="78" y="92" width="18" height="3" rx="1.5" fill="#FBBF24"/>
  </g>
</svg>
